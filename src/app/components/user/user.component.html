<h3>{{ title }}</h3>

<button class="btn btn-primary my-3" [routerLink]="['/users/create']">Crear usuario</button>

@if (users.length==0) {
<div class="alert alert-warning">No hay registros</div>
}@else {
<table class="table table-hover table-striped">
  <thead>
    <tr>
      <!-- <th>id</th>-->
      <th>nombre</th>
      <th>apellido</th>
      <th>email</th>
      <th>username</th>
      <th>eliminar</th>
      <th>actualizar</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users; track $index) {
    <tr>
      <!-- <td>{{user.id}} </td>-->
      <td>{{ user.name }}</td>
      <td>{{ user.lastname }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.username }}</td>
      <td>
        <button class="btn btn-danger btn-sm" (click)="onRemoveUSer(user.id)">
          Eliminar
        </button>
      </td>
      <td>
        <button class="btn btn-info btn-sm" (click)="onSelectedUser(user)">
          Editar
        </button>
      </td>
    </tr>
    }
  </tbody>
</table>

}
