<div class="container my-4">
    <h3>{{title}}</h3>

    
    <div class="row">
        <div class="col">
        <user-form 
        [user]="userSelected"
        (newUserEmitter)="addUser($event)"

        ></user-form>
        </div>
        <div class="col">
           <user [users]="users"
            (idUserEventEmitter)="removeUser($event)"
            (selectedUserEventEmitter)="setSelectedUser($event)"
            
            ></user>
        </div>
    </div>
</div>
