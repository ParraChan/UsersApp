<div class="container my-4">
    <h3>{{title}}</h3>

    <button class="btn btn-primary"
    (click)="setOpen()"
    >{{open==true? 'Cerrar': 'Crear usuario'}}</button>
    <div class="row">

        <div class="col">
            @if (open){
        <user-form 
        [user]="userSelected"
        (newUserEmitter)="addUser($event)"

        ></user-form>
            } @else {
            <div class="col">
           <user [users]="users"
            (idUserEventEmitter)="removeUser($event)"
            (selectedUserEventEmitter)="setSelectedUser($event)"
            
            ></user>
        </div>
            }
    
        </div>
        
    </div>
</div>
